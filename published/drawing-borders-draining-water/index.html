<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Open+Sans+Condensed:wght@300;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link href="https://unpkg.com/maplibre-gl-layer-manager@latest/src/layer-manager.css" rel="stylesheet">
  <link rel="stylesheet" href="./story-style.css">
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">🗺️</div>
  <div class="loading-text">Loading story map…</div>
  <div class="spinner"></div>
</div>

<div id="error-screen">
  <h2>Map not found</h2>
  <p>Could not load storyConfig.js or mapConfig.js.</p>
</div>

<div id="map"></div>
<div id="image-canvas-back" style="opacity:0;"></div>
<div id="image-canvas" style="opacity:0;"></div>

<div id="layers-menu"></div>

<div id="top-left-info">
  <div id="year-timeline">
    <div id="year-label">Year</div>
    <div id="year-value"></div>
  </div>
  <div id="population-display">
    <div id="population-label">Population</div>
    <div id="population-value"></div>
  </div>
</div>

<div id="top-right-controls">
  <div id="instructions-panel">
    <ul>
      <li><strong>Instructions:</strong></li>
      <li>Click and Hold the Map to view present day condition</li>
      <li>Click and Hold an image to enlarge it</li>
      <li>Scroll to go to the next section</li>
      <li>Double click on the map to zoom in</li>
    </ul>
  </div>
  <div id="info-icon" class="hidden">
    <i class="material-icons">info</i>
  </div>
</div>

<div class="icon-scroll" id="scroll-indicator">
  <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"></polyline>
  </svg>
</div>

<div id="chapter-nav-widget">
  <div id="chapter-nav-button"><span id="chapter-nav-counter"></span></div>
  <div id="chapter-nav-menu" class="hidden"></div>
</div>

<div id="map-legend"></div>
<div id="story"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@geomatico/maplibre-cog-protocol@0.5.0/dist/index.js"></script>
<script src="https://unpkg.com/maplibre-gl-layer-manager@latest/src/layer-manager.js"></script>
<script src="./storyConfig.js"></script>
<script src="./mapConfig.js"></script>
<script src="./viewer.js"></script>

</body>
</html>
