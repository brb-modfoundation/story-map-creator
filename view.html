<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0d1117;
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    /* ── Map ───────────────────────────── */
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Loading / Error ───────────────── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 1.5rem;
    }

    .loading-logo { font-size: 3rem; }

    .loading-text {
      font-size: 1rem;
      color: #7fb3d3;
      font-weight: 500;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #7fb3d3;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Story Panel ───────────────────── */
    #story-panel {
      position: fixed;
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }

    .chapter-card {
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .chapter-number-badge {
      display: inline-block;
      background: #2196f3;
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      margin-bottom: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .chapter-title {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: white;
    }

    .chapter-subtitle {
      font-size: 0.85rem;
      color: #7fb3d3;
      font-weight: 500;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .chapter-image {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 1rem;
      max-height: 200px;
      object-fit: cover;
    }

    .chapter-image-caption {
      font-size: 0.75rem;
      color: #6a8a9a;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
      font-style: italic;
    }

    .chapter-description {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #c8d8e8;
      margin-bottom: 1rem;
    }

    .chapter-quote {
      border-left: 3px solid #2196f3;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      background: rgba(33, 150, 243, 0.08);
      border-radius: 0 6px 6px 0;
      font-style: italic;
      color: #a8c8e0;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .chapter-source {
      font-size: 0.72rem;
      color: #557a90;
      margin-top: 0.4rem;
      font-style: normal;
    }

    .chapter-button {
      display: inline-block;
      margin-top: 1rem;
      background: #2196f3;
      color: white;
      text-decoration: none;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .chapter-button:hover { background: #1565c0; }

    /* ── Navigation ────────────────────── */
    #nav-controls {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 200;
      background: rgba(13,17,23,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 0.6rem 1.5rem;
      backdrop-filter: blur(12px);
    }

    .nav-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      padding: 0;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.4);
    }

    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .nav-counter {
      font-size: 0.85rem;
      color: #7fb3d3;
      min-width: 60px;
      text-align: center;
    }

    .nav-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-dot.active {
      background: #2196f3;
      width: 20px;
      border-radius: 4px;
    }

    /* ── Top bar ───────────────────────── */
    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 100%);
      pointer-events: none;
    }

    #map-title-display {
      font-size: 1rem;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    #error-screen {
      position: fixed;
      inset: 0;
      background: #0d1117;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 1000;
      text-align: center;
      padding: 2rem;
    }

    #error-screen h2 { font-size: 1.5rem; color: #e74c3c; }
    #error-screen p { color: #7fb3d3; font-size: 0.9rem; max-width: 400px; }
    #error-screen a { color: #2196f3; }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">🗺️</div>
  <div class="loading-text">Loading story map…</div>
  <div class="spinner"></div>
</div>

<div id="error-screen">
  <h2>Map not found</h2>
  <p>This story map doesn't exist or hasn't been published yet.</p>
  <a href="dashboard.html">← Back to dashboard</a>
</div>

<div id="map"></div>

<div id="top-bar">
  <span id="map-title-display"></span>
</div>

<div id="story-panel">
  <div class="chapter-card" id="chapter-card"></div>
</div>

<div id="nav-controls" style="display:none">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled>‹</button>
  <div class="nav-dots" id="nav-dots"></div>
  <span class="nav-counter" id="nav-counter">1 / 1</span>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">›</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@geomatico/maplibre-cog-protocol@0.5.0/dist/index.js"></script>

<script type="module">
import { supabase } from './supabase.js';

maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);

const params = new URLSearchParams(window.location.search);
const slug = params.get('id');

let viewerMap = null;
let chapters = [];
let currentIndex = 0;
let mapData = null;

// ── Load map ─────────────────────────────────────────────
const { data, error } = await supabase
  .from('story_maps')
  .select('title, story_config, map_config, published')
  .eq('slug', slug)
  .eq('published', true)
  .single();

if (error || !data) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-screen').style.display = 'flex';
} else {
  mapData = data;
  chapters = data.story_config?.chapters ?? [];
  document.getElementById('map-title-display').textContent = data.title;
  document.title = data.title + ' — Story Map';
  initMap(data.map_config);
}

// ── Init map ─────────────────────────────────────────────
function initMap(cfg) {
  const bm = cfg.basemaps?.[cfg.defaultBasemap] ?? {
    tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
    attribution: '© Google'
  };

  const style = {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: { basemap: { type: 'raster', tiles: bm.tiles, tileSize: 256, attribution: bm.attribution } },
    layers: [{ id: 'basemap-layer', type: 'raster', source: 'basemap', paint: { 'raster-opacity': 1 } }]
  };

  // Add data sources and layers
  if (cfg.sources) {
    Object.entries(cfg.sources).forEach(([id, src]) => {
      style.sources[id] = src;
    });
  }
  if (cfg.layers) {
    cfg.layers.forEach(l => style.layers.push({ ...l, layout: { ...l.layout, visibility: 'none' } }));
  }

  viewerMap = new maplibregl.Map({
    container: 'map',
    style,
    center: cfg.initialView?.center ?? [0, 20],
    zoom: cfg.initialView?.zoom ?? 2,
    interactive: true,
  });

  viewerMap.addControl(new maplibregl.NavigationControl(), 'top-right');

  viewerMap.on('load', () => {
    document.getElementById('loading-screen').style.display = 'none';

    if (chapters.length) {
      buildNavDots();
      document.getElementById('nav-controls').style.display = 'flex';
      document.getElementById('story-panel').style.display = 'block';
      goToChapter(0);
    }
  });
}

// ── Chapter navigation ────────────────────────────────────
window.navigate = (dir) => {
  const next = currentIndex + dir;
  if (next < 0 || next >= chapters.length) return;
  goToChapter(next);
};

function goToChapter(index) {
  currentIndex = index;
  const ch = chapters[index];

  // Fly map
  const flyOpts = {
    pitch: ch.pitch ?? 0,
    bearing: ch.bearing ?? 0,
    duration: ch.duration ?? 2000,
    essential: true,
  };

  if (ch.bounds) {
    viewerMap.fitBounds(ch.bounds, { padding: 60, ...flyOpts });
  } else if (ch.center) {
    viewerMap.flyTo({ center: ch.center, zoom: ch.zoom ?? 10, ...flyOpts });
  }

  // Toggle layers
  if (mapData.map_config?.layers) {
    mapData.map_config.layers.forEach(l => {
      if (viewerMap.getLayer(l.id)) {
        const cfg = ch.layers?.[l.id];
        viewerMap.setLayoutProperty(l.id, 'visibility', cfg ? 'visible' : 'none');
        if (cfg) {
          applyLayerStyle(l.id, l.type, cfg);
        }
      }
    });
  }

  // Render card
  renderChapterCard(ch, index);

  // Update nav
  document.getElementById('nav-counter').textContent = `${index + 1} / ${chapters.length}`;
  document.getElementById('prev-btn').disabled = index === 0;
  document.getElementById('next-btn').disabled = index === chapters.length - 1;

  document.querySelectorAll('.nav-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === index);
  });
}

function applyLayerStyle(layerId, layerType, cfg) {
  const color = cfg.color ?? '#0d6aff';
  const opacity = cfg.opacity ?? 1;
  const strokeWidth = cfg.strokeWidth ?? 2;
  try {
    if (layerType === 'raster') {
      viewerMap.setPaintProperty(layerId, 'raster-opacity', opacity);
    } else if (layerType === 'line') {
      viewerMap.setPaintProperty(layerId, 'line-color', color);
      viewerMap.setPaintProperty(layerId, 'line-opacity', opacity);
      viewerMap.setPaintProperty(layerId, 'line-width', strokeWidth);
    } else if (layerType === 'fill') {
      viewerMap.setPaintProperty(layerId, 'fill-color', color);
      viewerMap.setPaintProperty(layerId, 'fill-opacity', opacity);
    } else if (layerType === 'circle') {
      viewerMap.setPaintProperty(layerId, 'circle-color', color);
      viewerMap.setPaintProperty(layerId, 'circle-opacity', opacity);
    }
  } catch (e) { /* layer may not exist */ }
}

function renderChapterCard(ch, index) {
  const card = document.getElementById('chapter-card');
  let html = `<div class="chapter-number-badge">Chapter ${index + 1}</div>`;
  if (ch.subtitle) html += `<div class="chapter-subtitle">${ch.subtitle}</div>`;
  html += `<div class="chapter-title">${ch.title || 'Untitled'}</div>`;
  if (ch.image) {
    html += `<img class="chapter-image" src="${ch.image}" alt="${ch.title}" onerror="this.style.display='none'">`;
    if (ch.imageCaption) html += `<div class="chapter-image-caption">${ch.imageCaption}</div>`;
  }
  if (ch.description) {
    html += `<div class="chapter-description">${ch.description}`;
    if (ch.descriptionSource) html += `<div class="chapter-source">Source: ${ch.descriptionSource}</div>`;
    html += `</div>`;
  }
  if (ch.quote) {
    html += `<div class="chapter-quote">${ch.quote}`;
    if (ch.quoteSource) html += `<div class="chapter-source">— ${ch.quoteSource}</div>`;
    html += `</div>`;
  }
  if (ch.buttonText && ch.buttonUrl) {
    html += `<a class="chapter-button" href="${ch.buttonUrl}" target="_blank" rel="noopener">${ch.buttonText}</a>`;
  }
  card.innerHTML = html;
}

function buildNavDots() {
  const container = document.getElementById('nav-dots');
  container.innerHTML = '';
  chapters.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goToChapter(i);
    container.appendChild(dot);
  });
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') window.navigate(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') window.navigate(-1);
});
</script>

</body>
</html>
